name: Render Explorer Preview

on:
  push:
    paths:
      - "assets/explorer-preview-source.svg"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install renderer
        run: npm install --no-save sharp

      - name: Render high-quality JPEG
        run: |
          node <<'NODE'
          const sharp = require('sharp');
          sharp('assets/explorer-preview-source.svg', { density: 192 })
            .resize({ width: 1600 })
            .jpeg({ quality: 92, chromaSubsampling: '4:4:4', mozjpeg: true })
            .toFile('images/explorer-preview.jpg')
            .then(info => console.log(info))
            .catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Commit rendered preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/explorer-preview.jpg
          if git diff --cached --quiet; then
            echo "No preview changes to commit."
          else
            git commit -m "Render sharp Explorer preview"
            git push
          fi
