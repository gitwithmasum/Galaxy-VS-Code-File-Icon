<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#020817"/>
    <stop offset="0.55" stop-color="#07142b"/>
    <stop offset="1" stop-color="#100827"/>
  </linearGradient>
  <linearGradient id="cyanViolet" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#43efff"/>
    <stop offset="0.48" stop-color="#3f8cff"/>
    <stop offset="1" stop-color="#b15cff"/>
  </linearGradient>
  <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.28" stop-color="#57f0ff"/>
    <stop offset="0.65" stop-color="#4d8cff"/>
    <stop offset="1" stop-color="#c563ff"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
</defs>

